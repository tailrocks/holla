[tools]
"cargo:cargo-deb" = "3.7.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"
"cargo:cargo-zigbuild" = "0.23.3"
zig = "0.16.0"
mr-boxington = { version = "1.30.0", postinstall = "mbx setup --yes" }
rust = { version = "1.98.0", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
], mr_boxington = true }

[settings]
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tasks.ci]
depends = ["build", "test", "lint", "fmt"]

[tasks.build]
run = "cargo build --all-targets --all-features --locked"

[tasks.test]
run = "cargo nextest run --all-features --color=always --no-tests=pass"

[tasks.lint]
run = "cargo clippy --all-targets -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all --check"
