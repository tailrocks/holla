# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: CI / PR
run-name: CI / PR · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        required: false
        default: github
        type: choice
        options:
          - github
      scope:
        description: Verification scope
        required: true
        default: affected
        type: choice
        options:
          - affected
          - full
      base_sha:
        description: Git ref or SHA used as the affected-selection base
        required: false
        default: refs/heads/main
        type: string


concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: "Control / Planning"
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      units: ${{ steps.plan.outputs.units }}
      full_units: ${{ steps.plan.outputs.full_units }}
      rust_matrix: ${{ steps.plan.outputs.rust_matrix }}
      # Presence-only no-work marker: `planned_no_work` is `true` or absent,
      # never `false`. Consumers MUST branch
      # `needs.plan.outputs.planned_no_work == 'true'` for the no-work path;
      # any other value (including absent) means the plan selected work.
      planned_no_work: ${{ steps.plan.outputs.planned_no_work }}
      no_work_reason: ${{ steps.plan.outputs.no_work_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        id: runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@be61acbbbfb71db6b51337e547e39de049d4fc15
        with:
          rev: be61acbbbfb71db6b51337e547e39de049d4fc15
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=be61acbbbfb71db6b51337e547e39de049d4fc15" >> "$GITHUB_ENV"
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_OVERRIDE: ${{ github.event.inputs.scope || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
          HEAD_SHA: ${{ github.sha }}
          VELNOR_EXPECTED_WORK_FILE: .velnor-ci-expected-work/expected-work.json
          VELNOR_LANES: ${{ github.event.inputs.runner || 'github' }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_SCOPE_OVERRIDE:-}" ]]; then unset CI_SCOPE_OVERRIDE; fi
          mkdir -p .velnor-ci-expected-work
          velnor-workflow plan --config .github/ci/project.toml

      - name: Publish expected work
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-expected-work
          path: .velnor-ci-expected-work/expected-work.json
          if-no-files-found: error
          retention-days: 7
      - name: Prepare Velnor workflow runtime
        shell: bash
        env:
          EXPECTED_REVISION: be61acbbbfb71db6b51337e547e39de049d4fc15
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/velnor-workflow-runtime"
          rm -rf "$stage"
          mkdir -p "$stage"
          src="$(command -v velnor-workflow)"
          install -m 0755 "$src" "$stage/velnor-workflow"
          digest="$(sha256sum "$stage/velnor-workflow" | awk '{print $1}')"
          policy_src="${VELNOR_WORKFLOW_PINNED_BINARY:-$src}"
          install -m 0755 "$policy_src" "$stage/velnor-workflow-policy"
          policy_revision="$("$stage/velnor-workflow-policy" --revision)"
          policy_closure="$("$stage/velnor-workflow-policy" --closure)"
          [[ "$policy_closure" == "${{ steps.runtime.outputs.closure }}" ]] || { echo "::error::policy runtime reports closure $policy_closure, expected ${{ steps.runtime.outputs.closure }}" >&2; exit 1; }
          policy_digest="$(sha256sum "$stage/velnor-workflow-policy" | awk '{print $1}')"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$EXPECTED_REVISION" --arg closure "${{ steps.runtime.outputs.closure }}" --arg head_branch "${{ github.ref_name }}" --arg platform "${{ runner.os }}-${{ runner.arch }}" --arg run_id "$GITHUB_RUN_ID" --arg job_id "${{ github.job }}" --arg binary_sha256 "$digest" --arg policy_revision "$policy_revision" --arg policy_closure "$policy_closure" --arg policy_binary_sha256 "$policy_digest" '{repository: $repository, revision: $revision, closure: $closure, head_branch: $head_branch, platform: $platform, run_id: $run_id, job_id: $job_id, binary_sha256: $binary_sha256, policy_revision: $policy_revision, policy_closure: $policy_closure, policy_binary_sha256: $policy_binary_sha256}' > "$stage/manifest.json"
      - name: Publish Velnor workflow runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-workflow-runtime-be61acbbbfb71db6b51337e547e39de049d4fc15-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/velnor-workflow-runtime
          if-no-files-found: error
          retention-days: 7
  github-rust-holla-cli:
    name: "Rust · holla-cli"
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(format(',{0},', needs.plan.outputs.units), ',rust-holla-cli,') && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.runner == 'github' || github.event.inputs.runner == 'both' || github.event.inputs.runner == ''))) }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-rust.yml
    with:
      unit: rust-holla-cli
      lane: github
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      mbx_enabled: true
      mbx_compat: "4053d59b19f9"
      mbx_dependency_files: |
        .cargo/**
        Cargo.lock
        rust-toolchain
        rust-toolchain.toml
      mbx_freshness_files: |
        ./**/*.rs
        benches/**
        build.rs
        examples/**
        mise.lock
        src/**
        tests/**
      cache_paths: |
        ~/.cargo/registry
        ~/.cargo/git
      cache_key_files: |
        .cargo/**
        Cargo.lock
        rust-toolchain.toml
        rust-toolchain
      cargo_root: "."
      cargo_net_offline: true
      unit_admission: github
      validation_phases: "fmt,clippy,test"
  ci-required:
    name: ci-required
    if: ${{ !cancelled() }}
    needs: [plan, github-rust-holla-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download Velnor workflow runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: velnor-workflow-runtime-be61acbbbfb71db6b51337e547e39de049d4fc15-${{ runner.os }}-${{ runner.arch }}
          path: .velnor-workflow-runtime
      - name: Verify Velnor workflow runtime
        shell: bash
        env:
          EXPECTED_REVISION: be61acbbbfb71db6b51337e547e39de049d4fc15
        run: |
          set -euo pipefail
          manifest=.velnor-workflow-runtime/manifest.json
          jq -e --arg revision "$EXPECTED_REVISION" --arg repository "$GITHUB_REPOSITORY" --arg platform "${RUNNER_OS}-${RUNNER_ARCH}" --arg run_id "$GITHUB_RUN_ID" '.revision == $revision and .repository == $repository and .platform == $platform and .run_id == $run_id and (.run_id | test("^[0-9]+$")) and .job_id != "" and (.binary_sha256 | test("^[0-9a-f]{64}$")) and (.policy_binary_sha256 | test("^[0-9a-f]{64}$")) and (.closure | test("^[0-9a-f]{64}$")) and (.policy_closure | test("^[0-9a-f]{64}$"))' "$manifest" >/dev/null
          expected="$(jq -er '.binary_sha256' "$manifest")"
          actual="$(sha256sum .velnor-workflow-runtime/velnor-workflow | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo "::error::runtime digest mismatch" >&2; exit 1; }
          expected="$(jq -er '.policy_binary_sha256' "$manifest")"
          actual="$(sha256sum .velnor-workflow-runtime/velnor-workflow-policy | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo "::error::policy runtime digest mismatch" >&2; exit 1; }
      - name: Add Velnor workflow runtime to PATH
        shell: bash
        env:
          EXPECTED_REVISION: be61acbbbfb71db6b51337e547e39de049d4fc15
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/velnor-workflow-runtime-artifact"
          install -Dm0755 .velnor-workflow-runtime/velnor-workflow "$home/bin/velnor-workflow"
          install -Dm0755 .velnor-workflow-runtime/velnor-workflow-policy "$home/bin/velnor-workflow-policy"
          expected_closure="$(jq -er '.policy_closure' .velnor-workflow-runtime/manifest.json)"
          reported="$("$home/bin/velnor-workflow-policy" --closure)"
          [[ "$reported" == "$expected_closure" ]] || { echo "::error::policy runtime reports closure $reported, expected $expected_closure" >&2; exit 1; }
          echo "$home/bin" >> "$GITHUB_PATH"
          echo "VELNOR_WORKFLOW_PINNED_BINARY=$home/bin/velnor-workflow-policy" >> "$GITHUB_ENV"
      - name: Download expected work
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: velnor-expected-work
          path: .velnor-ci-expected-work
      - name: Download reported unit results
        # A no-work plan runs no unit jobs, so zero result artifacts is the
        # expected case there — and the aggregate fails a real-work plan with
        # zero records anyway. Tolerate the empty download; never the verdict.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: velnor-result-*
          merge-multiple: true
          path: .velnor-ci-results
      - name: Collect reported unit results
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p .velnor-ci-results
          files=(.velnor-ci-results/result-*.json)
          for file in "${files[@]}"; do
            if jq -e 'any(.results[]?; has("reused_from"))' "$file" >/dev/null; then
              echo "::error::$file carries reused_from without a validate_reuse decision; render emits no reused results" >&2
              exit 1
            fi
          done
          if (( ${#files[@]} == 0 )); then
            printf '{"results":[]}\n' > .velnor-ci-results.json
          else
            jq -s '{results: ([.[].results // empty] | add // [])}' "${files[@]}" > .velnor-ci-results.json
          fi
          echo "collected $(jq '.results | length' .velnor-ci-results.json) reported result(s) from ${#files[@]} record file(s)"
      - name: Score expected work against reported results
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          velnor-workflow aggregate --expected .velnor-ci-expected-work/expected-work.json --results .velnor-ci-results.json
      - name: Validate generated stack results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELECTED_UNITS: ${{ needs.plan.outputs.units }}
          LANE_ADMITTED_GITHUB: ${{ github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.runner == 'github' || github.event.inputs.runner == 'both' || github.event.inputs.runner == '')) }}
        shell: bash
        run: |
          set -euo pipefail
          result_for_job() {
            jq -r --arg job "$1" '.[$job].result // empty' <<<"$NEEDS_JSON"
          }
          result="$(result_for_job plan)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite plan did not pass: $result" >&2
            exit 1
          fi
          selected=",$SELECTED_UNITS,"
          if [[ "$selected" == *",rust-holla-cli,"* ]]; then
            result="$(result_for_job github-rust-holla-cli)"
            if [[ "$LANE_ADMITTED_GITHUB" == true ]]; then
              case "$result" in
                success) ;;
                *) echo "selected CI job github-rust-holla-cli did not pass: $result" >&2; exit 1 ;;
              esac
            else
              case "$result" in
                skipped) ;;
                *) echo "selected CI job github-rust-holla-cli ran outside its lane admission (LANE_ADMITTED_GITHUB=$LANE_ADMITTED_GITHUB): $result" >&2; exit 1 ;;
              esac
            fi
          else
            result="$(result_for_job github-rust-holla-cli)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI job github-rust-holla-cli failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
  required:
    name: "Control / Required"
    if: ${{ !cancelled() }}
    needs: [ci-required]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mirror CI / Required
        if: ${{ needs.ci-required.result != 'success' }}
        run: exit 1
