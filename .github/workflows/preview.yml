name: Publish Homebrew Preview

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Classify preview source (${{ matrix.config.lane }})
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 20
    outputs:
      source: ${{ steps.filter.outputs.source }}
      sha: ${{ steps.source.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve source SHA
        id: source
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0 # classify changes since the published preview SHA
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sha="$SOURCE_SHA"

          old_sha=""
          formula_err=""
          if formula_body=$(curl -fsSL --max-time 30 "https://raw.githubusercontent.com/tailrocks/homebrew-holla/main/Formula/holla-preview.rb" 2>&1); then
            old_sha=$(printf '%s\n' "$formula_body" | sed -n 's|^[[:space:]]*# source-sha: \([0-9a-f]\{40\}\)$|\1|p' | head -1)
          else
            formula_err="$formula_body"
            echo "::warning::failed to fetch homebrew-tap formula: ${formula_err}; falling open"
          fi

          if [ -n "$formula_err" ] || [ -z "$old_sha" ] || [ "$old_sha" = "$sha" ] \
             || ! git rev-parse --verify "${old_sha}^{commit}" >/dev/null 2>&1; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          diff_err=""
          if ! { diff_files=$(git diff --name-only "${old_sha}...${sha}" 2>/tmp/diff.err); }; then
            diff_err=$(cat /tmp/diff.err)
            echo "::warning::diff failed for ${old_sha}...${sha}: ${diff_err}; falling open"
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/preview.yml|Cargo.toml|Cargo.lock|build.rs|src/**)
                source=true
                ;;
            esac
          done <<< "$diff_files"

          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Compute preview metadata
        id: meta
        if: steps.filter.outputs.source == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FULL_SHA: ${{ steps.source.outputs.sha }}
        run: |
          base_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          base_version=${base_version%-dev}
          short_sha=$(printf '%s' "$FULL_SHA" | cut -c1-7)
          # shellcheck disable=SC2016 # literal GraphQL $variables, not shell expansion
          graphql_query='query($owner: String!, $name: String!, $oid: GitObjectID!) { repository(owner: $owner, name: $name) { object(oid: $oid) { ... on Commit { history(first: 1) { totalCount } } } } }'
          commit_count=$(
            jq -cn \
              --arg query "$graphql_query" \
              --arg owner "$GITHUB_REPOSITORY_OWNER" \
              --arg name "${GITHUB_REPOSITORY#*/}" \
              --arg oid "$FULL_SHA" \
              '{query: $query, variables: {owner: $owner, name: $name, oid: $oid}}' |
              curl -fsSL \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Content-Type: application/json" \
                --data @- \
                https://api.github.com/graphql |
              jq -er '.data.repository.object.history.totalCount'
          )
          {
            echo "full_sha=$FULL_SHA"
            echo "short_sha=$short_sha"
            echo "version=${base_version}-preview.${commit_count}+${short_sha}"
          } >> "$GITHUB_OUTPUT"

  rust:
    name: Build preview (${{ matrix.target }}, ${{ matrix.config.lane }})
    needs: audit
    if: needs.audit.outputs.source == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.audit.outputs.sha }}
          persist-credentials: false

      - id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
          disable_annotations: "false"

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: "rust zig cargo:cargo-zigbuild"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache Cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ matrix.config.lane }}-${{ runner.os }}-${{ github.job }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-target-${{ matrix.config.lane }}-${{ runner.os }}-${{ github.job }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', '**/Cargo.lock') }}-

      - name: Install mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - name: Build
        env:
          HOLLA_VERSION_OVERRIDE: ${{ needs.audit.outputs.version }}
        run: |
          cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="holla-${TARGET}.tar.gz"
          tar -czf "$archive" -C "target/${TARGET}/release" holla
          shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.config.writer
        with:
          name: holla-${{ matrix.target }}
          path: |
            holla-${{ matrix.target }}.tar.gz
            holla-${{ matrix.target }}.tar.gz.sha256

  macos:
    name: Build preview (${{ matrix.target }}, GitHub)
    needs: audit
    if: needs.audit.outputs.source == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.audit.outputs.sha }}
          persist-credentials: false

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
          disable_annotations: "false"

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: rust
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache Cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-GitHub-${{ runner.os }}-${{ github.job }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-target-GitHub-${{ runner.os }}-${{ github.job }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', '**/Cargo.lock') }}-

      - name: Build
        env:
          HOLLA_VERSION_OVERRIDE: ${{ needs.audit.outputs.version }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="holla-${TARGET}.tar.gz"
          tar -czf "$archive" -C "target/${TARGET}/release" holla
          shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holla-${{ matrix.target }}
          path: |
            holla-${{ matrix.target }}.tar.gz
            holla-${{ matrix.target }}.tar.gz.sha256

  attest:
    name: Attest preview archives on GitHub
    needs: [audit, rust, macos]
    if: needs.audit.outputs.source == 'true'
    runs-on: ${{ 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: holla-*
          merge-multiple: true

      - name: Validate exact archive set
        run: |
          set -euo pipefail
          find artifacts -maxdepth 1 -type f -name 'holla-*.tar.gz' -print | sort > actual
          cat > expected <<'EOF'
          artifacts/holla-aarch64-apple-darwin.tar.gz
          artifacts/holla-aarch64-unknown-linux-gnu.tar.gz
          artifacts/holla-x86_64-apple-darwin.tar.gz
          artifacts/holla-x86_64-unknown-linux-gnu.tar.gz
          EOF
          diff -u expected actual

      - name: Attest every preview archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/holla-*.tar.gz

  release:
    name: Publish preview (${{ matrix.config.lane }})
    needs: [audit, rust, macos, attest]
    if: needs.audit.outputs.source == 'true'
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.audit.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0 # build the preview PR's source commit range

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: holla-*
          merge-multiple: true

      - name: Compute preview metadata
        id: meta
        env:
          FULL_SHA: ${{ needs.audit.outputs.sha }}
          SHORT_SHA: ${{ needs.audit.outputs.short_sha }}
          VERSION: ${{ needs.audit.outputs.version }}
        run: |
          {
            echo "full_sha=$FULL_SHA"
            echo "short_sha=$SHORT_SHA"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Read platform SHA256s
        id: shas
        run: |
          {
            echo "arm64_macos=$(cat artifacts/holla-aarch64-apple-darwin.tar.gz.sha256)"
            echo "x86_macos=$(cat artifacts/holla-x86_64-apple-darwin.tar.gz.sha256)"
            echo "arm64_linux=$(cat artifacts/holla-aarch64-unknown-linux-gnu.tar.gz.sha256)"
            echo "x86_linux=$(cat artifacts/holla-x86_64-unknown-linux-gnu.tar.gz.sha256)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish preview GitHub Release
        if: matrix.config.writer
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ needs.audit.outputs.sha }}
        run: |
          set -euo pipefail
          notes="Preview build from [${SHA:0:7}](https://github.com/${GITHUB_REPOSITORY}/commit/${SHA})."
          assets=(
            artifacts/holla-*.tar.gz
            artifacts/holla-*.tar.gz.sha256
          )

          if view_output=$(gh release view preview --json tagName 2>&1); then
            echo "preview release exists: $view_output"
            gh release edit preview \
              --prerelease \
              --target "$SHA" \
              --title "Preview ${VERSION}" \
              --notes "$notes"
            gh release upload preview "${assets[@]}" --clobber
            exit 0
          fi

          status=$?
          if echo "$view_output" | grep -qiE 'release not found|not found|release does not exist'; then
            gh release create preview \
              --prerelease \
              --target "$SHA" \
              --title "Preview ${VERSION}" \
              --notes "$notes" \
              "${assets[@]}"
          else
            echo "::error::gh release view failed: $view_output"
            exit "$status"
          fi
