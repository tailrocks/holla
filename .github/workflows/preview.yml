name: Publish Homebrew Preview

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebrew-tap-publish
  cancel-in-progress: true

jobs:
  source-changed:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve source SHA
        id: source
        env:
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "sha=${DISPATCH_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${WORKFLOW_RUN_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sha="$SOURCE_SHA"

          old_sha=""
          formula_err=""
          if formula_body=$(curl -fsSL --max-time 30 "https://raw.githubusercontent.com/tailrocks/homebrew-holla/main/Formula/holla-preview.rb" 2>&1); then
            old_sha=$(printf '%s\n' "$formula_body" | sed -n 's|^[[:space:]]*# source-sha: \([0-9a-f]\{40\}\)$|\1|p' | head -1)
          else
            formula_err="$formula_body"
            echo "::warning::failed to fetch homebrew-tap formula: ${formula_err}; falling open"
          fi

          if [ -n "$formula_err" ] || [ -z "$old_sha" ] || [ "$old_sha" = "$sha" ] \
             || ! git rev-parse --verify "${old_sha}^{commit}" >/dev/null 2>&1; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          diff_err=""
          if ! { diff_files=$(git diff --name-only "${old_sha}...${sha}" 2>/tmp/diff.err); }; then
            diff_err=$(cat /tmp/diff.err)
            echo "::warning::diff failed for ${old_sha}...${sha}: ${diff_err}; falling open"
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/preview.yml|Cargo.toml|Cargo.lock|build.rs|src/**)
                source=true
                ;;
            esac
          done <<< "$diff_files"

          echo "source=$source" >> "$GITHUB_OUTPUT"

  build-preview:
    needs: source-changed
    if: needs.source-changed.outputs.source == 'true'
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            zigbuild: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            zigbuild: true
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.source-changed.outputs.sha }}

      - id: sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        continue-on-error: true
        env:
          SCCACHE_GHA_ENABLED: "true"

      - name: Enable sccache
        if: steps.sccache.outcome == 'success'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install_args: "${{ matrix.zigbuild && 'rust zig cargo:cargo-zigbuild' || 'rust' }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Install mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - name: Build
        run: |
          if [ "${{ matrix.zigbuild }}" = "true" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="holla-${TARGET}.tar.gz"
          tar -czf "$archive" -C "target/${TARGET}/release" holla
          shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: holla-${{ matrix.target }}
          path: |
            holla-${{ matrix.target }}.tar.gz
            holla-${{ matrix.target }}.tar.gz.sha256

  publish-preview:
    needs: [source-changed, build-preview]
    if: needs.source-changed.outputs.source == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.source-changed.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify source SHA is on main
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FULL_SHA: ${{ needs.source-changed.outputs.sha }}
        run: |
          compare_status=$(
            curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${FULL_SHA}...main" |
              jq -er '.status'
          )

          case "$compare_status" in
            identical|ahead) ;;
            *)
              echo "::error::source SHA ${FULL_SHA} is not on main (compare status: ${compare_status})"
              exit 1
              ;;
          esac

      - name: Compute preview metadata
        id: meta
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FULL_SHA: ${{ needs.source-changed.outputs.sha }}
        run: |
          base_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          base_version=${base_version%-dev}
          short_sha=$(printf '%s' "$FULL_SHA" | cut -c1-7)
          # shellcheck disable=SC2016 # literal GraphQL $variables, not shell expansion
          graphql_query='query($owner: String!, $name: String!, $oid: GitObjectID!) { repository(owner: $owner, name: $name) { object(oid: $oid) { ... on Commit { history(first: 1) { totalCount } } } } }'
          commit_count=$(
            jq -cn \
              --arg query "$graphql_query" \
              --arg owner "$GITHUB_REPOSITORY_OWNER" \
              --arg name "${GITHUB_REPOSITORY#*/}" \
              --arg oid "$FULL_SHA" \
              '{query: $query, variables: {owner: $owner, name: $name, oid: $oid}}' |
              curl -fsSL \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Content-Type: application/json" \
                --data @- \
                https://api.github.com/graphql |
              jq -er '.data.repository.object.history.totalCount'
          )
          {
            echo "full_sha=$FULL_SHA"
            echo "short_sha=$short_sha"
            echo "version=${base_version}-preview.${commit_count}+${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Read platform SHA256s
        id: shas
        run: |
          {
            echo "arm64_macos=$(cat artifacts/holla-aarch64-apple-darwin.tar.gz.sha256)"
            echo "x86_macos=$(cat artifacts/holla-x86_64-apple-darwin.tar.gz.sha256)"
            echo "arm64_linux=$(cat artifacts/holla-aarch64-unknown-linux-gnu.tar.gz.sha256)"
            echo "x86_linux=$(cat artifacts/holla-x86_64-unknown-linux-gnu.tar.gz.sha256)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish preview GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ needs.source-changed.outputs.sha }}
        run: |
          set -euo pipefail
          notes="Preview build from [${SHA:0:7}](https://github.com/${GITHUB_REPOSITORY}/commit/${SHA})."
          assets=(
            artifacts/holla-*.tar.gz
            artifacts/holla-*.tar.gz.sha256
          )

          if view_output=$(gh release view preview --json tagName 2>&1); then
            echo "preview release exists: $view_output"
            gh release edit preview \
              --prerelease \
              --target "$SHA" \
              --title "Preview ${VERSION}" \
              --notes "$notes"
            gh release upload preview "${assets[@]}" --clobber
            exit 0
          fi

          status=$?
          if echo "$view_output" | grep -qiE 'release not found|not found|release does not exist'; then
            gh release create preview \
              --prerelease \
              --target "$SHA" \
              --title "Preview ${VERSION}" \
              --notes "$notes" \
              "${assets[@]}"
          else
            echo "::error::gh release view failed: $view_output"
            exit "$status"
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: tailrocks/homebrew-holla
          ref: main
          token: ${{ secrets.GH_HOLLA_HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Verify preview alias
        run: |
          test -L homebrew-tap/Aliases/holla@preview
          test "$(readlink homebrew-tap/Aliases/holla@preview)" = "../Formula/holla-preview.rb"

      - name: Extract previous preview SHA
        id: prev
        run: |
          old_sha=$(
            sed -n 's|^[[:space:]]*# source-sha: \([0-9a-f]\{40\}\)$|\1|p' \
              homebrew-tap/Formula/holla-preview.rb | head -1
          )
          echo "old_sha=${old_sha}" >> "$GITHUB_OUTPUT"

      - name: Rewrite preview formula
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          FULL_SHA: ${{ steps.meta.outputs.full_sha }}
          ARM64_SHA256: ${{ steps.shas.outputs.arm64_macos }}
          X86_SHA256: ${{ steps.shas.outputs.x86_macos }}
          LINUX_ARM64_SHA256: ${{ steps.shas.outputs.arm64_linux }}
          LINUX_X86_SHA256: ${{ steps.shas.outputs.x86_linux }}
        run: |
          cat > homebrew-tap/Formula/holla-preview.rb <<EOF
          # source-sha: ${FULL_SHA}
          class HollaPreview < Formula
            desc "Adaptive dev environment CLI — preview build from latest main"
            homepage "https://github.com/tailrocks/holla"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/tailrocks/holla/releases/download/preview/holla-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM64_SHA256}"
              end
              on_intel do
                url "https://github.com/tailrocks/holla/releases/download/preview/holla-x86_64-apple-darwin.tar.gz"
                sha256 "${X86_SHA256}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/tailrocks/holla/releases/download/preview/holla-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_ARM64_SHA256}"
              end
              on_intel do
                url "https://github.com/tailrocks/holla/releases/download/preview/holla-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_X86_SHA256}"
              end
            end

            conflicts_with "tailrocks/holla/holla", because: "preview and stable install the same binary"

            def install
              bin.install "holla"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/holla --version")
            end
          end
          EOF

      - name: Verify preview formula downloads
        run: |
          set -euo pipefail
          while IFS= read -r url; do
            echo "Verifying $url"
            curl -fsIL --retry 3 --retry-all-errors --max-time 30 "$url" >/dev/null
          done < <(
            sed -n 's|^[[:space:]]*url "\(https://github.com/tailrocks/holla/releases/download/preview/[^"]*\)".*$|\1|p' \
              homebrew-tap/Formula/holla-preview.rb
          )

      - name: Build PR body
        id: pr_body
        env:
          OLD_SHA: ${{ steps.prev.outputs.old_sha }}
          NEW_SHA: ${{ steps.meta.outputs.full_sha }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          body_file="${RUNNER_TEMP}/pr-body.md"
          {
            printf 'Automated preview formula update for **holla@preview %s**.\n\n' "$VERSION"
            # shellcheck disable=SC2016 # literal markdown backticks, not shell expansion
            printf -- '- Source: [`%s`](https://github.com/tailrocks/holla/commit/%s)\n' \
              "${NEW_SHA:0:7}" "$NEW_SHA"
            if [ -n "$OLD_SHA" ] && [ "$OLD_SHA" != "$NEW_SHA" ]; then
              # shellcheck disable=SC2016 # literal markdown backticks, not shell expansion
              printf -- '- Previous: [`%s`](https://github.com/tailrocks/holla/commit/%s)\n' \
                "${OLD_SHA:0:7}" "$OLD_SHA"
              printf -- '- [Full diff](https://github.com/tailrocks/holla/compare/%s...%s)\n' \
                "$OLD_SHA" "$NEW_SHA"
            fi
            printf '\n## Commits\n\n'
            if [ -n "$OLD_SHA" ] \
               && git -C "${GITHUB_WORKSPACE}" rev-parse --verify --quiet "${OLD_SHA}^{commit}" >/dev/null; then
              git -C "${GITHUB_WORKSPACE}" log --pretty=format:'- %s (%h)' "${OLD_SHA}..${NEW_SHA}"
              printf '\n'
            else
              printf '_No prior preview SHA found; commit range unavailable._\n'
            fi
          } > "$body_file"
          echo "body_file=$body_file" >> "$GITHUB_OUTPUT"

      - name: Open and merge PR for tap update
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.GH_HOLLA_HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          PR_BODY_FILE: ${{ steps.pr_body.outputs.body_file }}
        run: |
          git add Formula/holla-preview.rb
          if git diff --cached --quiet --exit-code; then
            echo "Preview formula already up to date"
            exit 0
          fi
          branch="preview/formula-${SHORT_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "holla@preview ${VERSION}"
          git push -u origin "$branch"
          pr_url=$(gh pr create \
            --title "holla@preview ${VERSION}" \
            --body-file "$PR_BODY_FILE" \
            --base main \
            --head "$branch")
          echo "Opened PR: $pr_url"
          gh pr merge "$pr_url" --squash --delete-branch
