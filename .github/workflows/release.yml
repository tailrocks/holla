# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: Package feed
run-name: Package feed · homebrew · ${{ github.event_name }}

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        required: false
        default: github
        type: choice
        options:
          - github
          - velnor
          - both
      channel:
        description: Package channel
        required: false
        default: stable
        type: choice
        options:
          - stable
          - preview

concurrency:
  group: package-feed-homebrew-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  admit-runner:
    name: Admit feed runner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject Velnor-only feed mutation
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'velnor' }}
        run: |
          echo 'homebrew feed mutation publishes from GitHub only' >&2
          exit 1
  verify:
    name: Verify homebrew feed
    needs: [admit-runner]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce workflow policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: velnor-workflow policy --workflow-root "$GITHUB_WORKSPACE"
      - name: Verify feed inputs
        run: velnor-workflow release verify-feed --kind homebrew --package holla --coordinate "tailrocks/holla"
  mutate:
    name: Update homebrew feed
    needs: [admit-runner, verify]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event.inputs.runner != 'velnor' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: package-feed
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update feed
        env:
          CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
        run: velnor-workflow release update-feed --kind homebrew --package holla --coordinate "tailrocks/holla" --channel "$CHANNEL"
