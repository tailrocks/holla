name: Renovate Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify mise versions in mise.toml (example for holla's zig/cargo-zigbuild pins)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f mise.toml ]; then
            echo "Found mise.toml; Renovate customManagers can be added for specific pinned tools if needed (e.g. zig, cargo-zigbuild)."
            # Add specific checks here if holla pins versions in other files like in jackin's versions.env
          fi
          echo "Renovate validate passed (basic checks for holla)."
