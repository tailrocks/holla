# Build holla .deb(s) for Linux on a version tag, attach them to the GitHub
# Release Debian artifacts in the source repository. Consumers pull and verify;
# this workflow never writes or dispatches holla-apt.
#
# Both holla and velnor now use the exact same modern approach:
# - jdx/mise-action to install rust + zig + cargo-zigbuild (project standard)
# - sccache + mold for fast/reproducible builds
# - cargo zigbuild --release --locked --target $TGT (modern glibc, no .2.17)
# - cargo deb --target $TGT --no-build --deb-version "$VERSION"
# - Matrix for amd64 + arm64
# - Staging + artifact per target, then attach to the source release
#
# We only target the latest and greatest Debian (recent glibc via zigbuild,
# no old-glibc compatibility shims). $auto depends in
# cargo-deb + modern target produce a .deb suitable for current Debian/Ubuntu.
#
# Separate from main release.yml, which builds multi-platform tarballs.
#
# Why separate from the main release.yml?
# - Main release handles multi-platform tarballs + Homebrew tap update.
# - This workflow owns .deb production in the source release only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]
      tag:
        description: "Existing tag to (re)build the .deb(s) for (e.g. v0.2.0)."
        type: string
        required: true

permissions:
  contents: write # create/upload the GitHub Release asset on the source repo

concurrency:
  group: release-deb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    name: Build deb (${{ matrix.target }}, ${{ matrix.config.lane }})
    # Linux-only .deb builds for the holla-apt repository.
    # Uses the exact same jdx/mise-action + zigbuild pattern as jackin-project/jackin
    # (see their ci.yml / release.yml build-validator and build-jackin-capsule jobs).
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ github.event.inputs.tag && github.event.inputs.tag || github.ref_name }}
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
          disable_annotations: "false"

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: "rust zig cargo:cargo-zigbuild"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: rustup target add ${{ matrix.target }}


      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache Cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ matrix.config.lane }}-${{ runner.os }}-${{ github.job }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-target-${{ matrix.config.lane }}-${{ runner.os }}-${{ github.job }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', '**/Cargo.lock') }}-

      - name: Install mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - name: Build
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          export HOLLA_VERSION_OVERRIDE="${TAG#v}"
          # Use modern glibc target (no .2.17) because we only target latest Debian
          # for the .deb packages (see previous "latest and greatest Debian only" requirement).
          cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Build .deb (version pinned to the tag)
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # --no-strip: the binary is already stripped at link time
          # (profile.release strip=true); the host `strip` cannot process a
          # cross-built foreign-arch ELF, so cargo-deb's own strip pass must
          # be skipped or the arm64 build fails. (Same fix as velnor.)
          mise exec "cargo:cargo-deb@3.7.0" -- cargo deb --target ${{ matrix.target }} --no-build --no-strip --deb-version "$VERSION"
          ls -la target/${{ matrix.target }}/debian/*.deb

      - name: Stage .deb for artifacts
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DEB_SRC=$(find "target/${{ matrix.target }}/debian" -maxdepth 1 -name 'holla_*.deb' | head -1)
          DEB_DST="holla-${VERSION}-${{ matrix.target }}.deb"
          cp "$DEB_SRC" "$DEB_DST"
          sha256sum "$DEB_DST" | awk '{print $1}' > "$DEB_DST.sha256"
          ls -l "$DEB_DST"*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.config.writer
        with:
          name: holla-deb-${{ matrix.target }}
          path: |
            holla-*.deb
            holla-*.deb.sha256

  package-record:
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.identity.outputs.version }}
      source-ref: ${{ steps.identity.outputs.source-ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - id: identity
        name: Bind complete source release and assemble package record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          version=${TAG#v}
          {
            echo "version=$version"
            echo "source-ref=refs/tags/$TAG"
          } >> "$GITHUB_OUTPUT"
          for attempt in {1..30}; do
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'holla-*.tar.gz' --pattern 'holla-*.tar.gz.sha256' \
              --dir artifacts/source-release 2>/dev/null; then break; fi
            test "$attempt" -lt 30
            sleep 10
          done
          subjects=(artifacts/source-release/holla-*.tar.gz artifacts/holla-*.deb)
          test "${#subjects[@]}" -eq 6
          : > SHA256SUMS
          : > assets.jsonl
          mkdir signer-input
          for subject in "${subjects[@]}"; do
            name=$(basename "$subject")
            digest=$(sha256sum "$subject" | awk '{print $1}')
            checksum_lines=$(wc -l < "${subject}.sha256")
            test "$checksum_lines" -eq 1
            declared_digest=$(awk 'NF >= 1 {print $1}' "${subject}.sha256")
            [[ "$declared_digest" =~ ^[0-9a-f]{64}$ ]]
            test "$declared_digest" = "$digest"
            printf '%s  %s\n' "$digest" "$name" >> SHA256SUMS
            jq -cn --arg name "$name" --arg sha256 "$digest" '{name:$name,sha256:$sha256}' >> assets.jsonl
            cp "$subject" signer-input/
          done
          source_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          test "$source_commit" = "$(git rev-parse HEAD)"
          jq -S -n --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_ref "refs/tags/$TAG" --arg source_commit "$source_commit" \
            --arg version "$version" --slurpfile assets assets.jsonl \
            '{schema:"velnor.package-release.v1",source_repository:$source_repository,source_ref:$source_ref,source_commit:$source_commit,version:$version,assets:$assets}' \
            > release-manifest.json
          # SHA256SUMS names the immutable signer corpus by basename. Verify
          # from that corpus directory instead of the workflow workspace.
          (cd signer-input && sha256sum --check --strict ../SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-subjects
          path: signer-input
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-release-metadata
          path: |
            release-manifest.json
            SHA256SUMS
          if-no-files-found: error

  sign-arm64-macos:
    needs: package-record
    permissions: {attestations: write, contents: read, id-token: write}
    uses: tailrocks/velnor-actions/.github/workflows/package-signer.yml@22fd17a3ab701f84baa11fb28040127d2096b9d3 # 2026.8.19
    with:
      artifact-name: package-subjects
      subject-path: holla-${{ needs.package-record.outputs.version }}-aarch64-apple-darwin.tar.gz
      source-ref: ${{ needs.package-record.outputs.source-ref }}

  sign-x86-macos:
    needs: package-record
    permissions: {attestations: write, contents: read, id-token: write}
    uses: tailrocks/velnor-actions/.github/workflows/package-signer.yml@22fd17a3ab701f84baa11fb28040127d2096b9d3 # 2026.8.19
    with:
      artifact-name: package-subjects
      subject-path: holla-${{ needs.package-record.outputs.version }}-x86_64-apple-darwin.tar.gz
      source-ref: ${{ needs.package-record.outputs.source-ref }}

  sign-arm64-linux:
    needs: package-record
    permissions: {attestations: write, contents: read, id-token: write}
    uses: tailrocks/velnor-actions/.github/workflows/package-signer.yml@22fd17a3ab701f84baa11fb28040127d2096b9d3 # 2026.8.19
    with:
      artifact-name: package-subjects
      subject-path: holla-${{ needs.package-record.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz
      source-ref: ${{ needs.package-record.outputs.source-ref }}

  sign-x86-linux:
    needs: package-record
    permissions: {attestations: write, contents: read, id-token: write}
    uses: tailrocks/velnor-actions/.github/workflows/package-signer.yml@22fd17a3ab701f84baa11fb28040127d2096b9d3 # 2026.8.19
    with:
      artifact-name: package-subjects
      subject-path: holla-${{ needs.package-record.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
      source-ref: ${{ needs.package-record.outputs.source-ref }}

  sign-arm64-deb:
    needs: package-record
    permissions: {attestations: write, contents: read, id-token: write}
    uses: tailrocks/velnor-actions/.github/workflows/package-signer.yml@22fd17a3ab701f84baa11fb28040127d2096b9d3 # 2026.8.19
    with:
      artifact-name: package-subjects
      subject-path: holla-${{ needs.package-record.outputs.version }}-aarch64-unknown-linux-gnu.deb
      source-ref: ${{ needs.package-record.outputs.source-ref }}

  sign-x86-deb:
    needs: package-record
    permissions: {attestations: write, contents: read, id-token: write}
    uses: tailrocks/velnor-actions/.github/workflows/package-signer.yml@22fd17a3ab701f84baa11fb28040127d2096b9d3 # 2026.8.19
    with:
      artifact-name: package-subjects
      subject-path: holla-${{ needs.package-record.outputs.version }}-x86_64-unknown-linux-gnu.deb
      source-ref: ${{ needs.package-record.outputs.source-ref }}

  publish-package-record:
    needs: [package-record, sign-arm64-macos, sign-x86-macos, sign-arm64-linux, sign-x86-linux, sign-arm64-deb, sign-x86-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish missing package assets without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          for file in artifacts/holla-*.deb artifacts/holla-*.deb.sha256 artifacts/release-manifest.json artifacts/SHA256SUMS; do
            name=$(basename "$file")
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/existing" >/dev/null 2>&1; then
              test "$(sha256sum "$file" | awk '{print $1}')" = "$(sha256sum "$RUNNER_TEMP/existing/$name" | awk '{print $1}')"
            else
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
