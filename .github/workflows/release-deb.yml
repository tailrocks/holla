name: Release deb

# Build holla .deb(s) for Linux on a version tag, attach them to the GitHub
# Release (source), and (optionally) push them to the holla-apt repo so it can
# publish the apt repository. This is the dedicated deb flow, modeled directly
# on velnor-project/velnor/.github/workflows/release-deb.yml + velnor-apt.
#
# The build runs inside a `debian:stable-slim` container so that all system
# library dependencies (resolved via dpkg-shlibdeps / `$auto` in cargo-deb)
# are for the latest and greatest Debian, not Ubuntu.
#
# We only target the latest and greatest Debian (recent glibc). No old-glibc
# compatibility shims (those are only in the portable tarball builds for
# Homebrew).
#
# Why separate from the main release.yml?
# - Main release handles multi-platform tarballs + Homebrew tap update.
# - This workflow owns .deb production + the cross-repo upload to holla-apt
#   (so holla-apt/publish.yml can download from *its own* releases using only
#   its default GITHUB_TOKEN).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the .deb(s) for (e.g. v0.2.0)."
        type: string
        required: true

permissions:
  contents: write # create/upload the GitHub Release asset on the source repo

jobs:
  build-deb:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    container:
      image: debian:stable-slim
    env:
      VERSION: ${{ github.event.inputs.tag && github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Debian build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            curl \
            ca-certificates \
            git \
            xz-utils \
            dpkg-dev

      - name: Install Rust via rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Zig (for arm64 cross-compilation only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          ZIG_VERSION: "0.14.0"
        run: |
          curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p /opt/zig
          tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> $GITHUB_PATH

      - name: Install cargo-zigbuild (arm64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cargo-zigbuild --locked

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            /root/.cargo/registry/cache
            /root/.cargo/registry/index
            /root/.cargo/git/db
          key: cargo-deb-debian-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-deb-debian-${{ matrix.target }}-

      - name: Build (latest Debian only; recent glibc, no old compat needed)
        run: |
          # Build environment is Debian stable (latest stable at build time).
          # This ensures dpkg-shlibdeps / $auto dependencies in the .deb
          # reference Debian package names and versions, not Ubuntu's.
          # amd64: native build inside Debian container.
          # arm64: cross via zigbuild (modern glibc, no .2.17).
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb (version pinned to the tag)
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          cargo deb --target ${{ matrix.target }} --no-build --deb-version "$VERSION"
          ls -la target/${{ matrix.target }}/debian/*.deb

      - name: Stage .deb for artifacts
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DEB_SRC=$(ls target/${{ matrix.target }}/debian/holla_*.deb | head -1)
          DEB_DST="holla-${VERSION}-${{ matrix.target }}.deb"
          cp "$DEB_SRC" "$DEB_DST"
          sha256sum "$DEB_DST" | awk '{print $1}' > "$DEB_DST.sha256"
          ls -l "$DEB_DST"*

      - uses: actions/upload-artifact@v4
        with:
          name: holla-deb-${{ matrix.target }}
          path: |
            holla-*.deb
            holla-*.deb.sha256

  attach-and-deliver:
    needs: build-deb
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach .deb(s) to the GitHub Release (source)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Create the release if it does not exist yet (the main release.yml may have created it with tarballs), then upload the deb assets.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" artifacts/holla-*-unknown-linux-gnu.deb artifacts/holla-*-unknown-linux-gnu.deb.sha256 --clobber

      - name: Push .deb(s) to holla-apt + trigger publish (optional)
        # Same pattern as velnor: the source may be private (or we want consistent
        # delivery). holla-apt publishes from its *own* release. So we upload the
        # .deb(s) to a holla-apt release (same tag), then trigger its publish workflow.
        # Needs GH_HOLLA_APT_TOKEN: a PAT with Contents:write + Actions:write on
        # tailrocks/holla-apt. Without it, publish manually (see echo below).
        env:
          APT_TOKEN: ${{ secrets.GH_HOLLA_APT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${APT_TOKEN:-}" ]; then
            echo "No GH_HOLLA_APT_TOKEN secret; skipping auto-publish to apt."
            echo "Publish manually:"
            echo "  gh release upload $TAG holla-*-unknown-linux-gnu.deb holla-*-unknown-linux-gnu.deb.sha256 --repo tailrocks/holla-apt --clobber"
            echo "  gh workflow run publish.yml --repo tailrocks/holla-apt -f version=$TAG"
            exit 0
          fi
          export GH_TOKEN="$APT_TOKEN"
          gh release view "$TAG" --repo tailrocks/holla-apt >/dev/null 2>&1 \
            || gh release create "$TAG" --repo tailrocks/holla-apt --title "holla $TAG (debs)" --notes "holla .debs for apt repository (amd64 + arm64)."
          gh release upload "$TAG" artifacts/holla-*-unknown-linux-gnu.deb artifacts/holla-*-unknown-linux-gnu.deb.sha256 --repo tailrocks/holla-apt --clobber
          gh workflow run publish.yml --repo tailrocks/holla-apt -f version="$TAG"
          echo "Uploaded holla debs to holla-apt $TAG and triggered publish."
