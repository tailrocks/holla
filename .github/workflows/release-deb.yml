# Build holla .deb(s) for Linux on a version tag, attach them to the GitHub
# Release (source), and (optionally) push them to the holla-apt repo so it can
# publish the apt repository. This is the dedicated deb flow.
#
# Both holla and velnor now use the exact same modern approach:
# - jdx/mise-action to install rust + zig + cargo-zigbuild (project standard)
# - sccache + mold for fast/reproducible builds
# - cargo zigbuild --release --locked --target $TGT (modern glibc, no .2.17)
# - cargo deb --target $TGT --no-build --deb-version "$VERSION"
# - Matrix for amd64 + arm64
# - Staging + artifact per target, then attach + optional cross to *-apt
#
# We only target the latest and greatest Debian (recent glibc via zigbuild,
# no old-glibc compatibility shims). $auto depends in
# cargo-deb + modern target produce a .deb suitable for current Debian/Ubuntu.
#
# Separate from main release.yml (which does multi-platform tarballs +
# Homebrew tap update) so that .debs can be cross-uploaded to holla-apt's
# own releases (allowing publish.yml to consume them with default GITHUB_TOKEN).
#
# Why separate from the main release.yml?
# - Main release handles multi-platform tarballs + Homebrew tap update.
# - This workflow owns .deb production + the cross-repo upload to holla-apt
#   (so holla-apt/publish.yml can download from *its own* releases using only
#   its default GITHUB_TOKEN).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]
      tag:
        description: "Existing tag to (re)build the .deb(s) for (e.g. v0.2.0)."
        type: string
        required: true

permissions:
  contents: write # create/upload the GitHub Release asset on the source repo

concurrency:
  group: release-deb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    name: Build deb (${{ matrix.target }}, ${{ matrix.config.lane }})
    # Linux-only .deb builds for the holla-apt repository.
    # Uses the exact same jdx/mise-action + zigbuild pattern as jackin-project/jackin
    # (see their ci.yml / release.yml build-validator and build-jackin-capsule jobs).
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ github.event.inputs.tag && github.event.inputs.tag || github.ref_name }}
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
          disable_annotations: "false"

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: "rust zig cargo:cargo-zigbuild"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: rustup target add ${{ matrix.target }}


      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache Cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ matrix.config.lane }}-${{ runner.os }}-${{ github.job }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-target-${{ matrix.config.lane }}-${{ runner.os }}-${{ github.job }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', '**/Cargo.lock') }}-

      - name: Install mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - name: Build
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          export HOLLA_VERSION_OVERRIDE="${TAG#v}"
          # Use modern glibc target (no .2.17) because we only target latest Debian
          # for the .deb packages (see previous "latest and greatest Debian only" requirement).
          cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Build .deb (version pinned to the tag)
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # --no-strip: the binary is already stripped at link time
          # (profile.release strip=true); the host `strip` cannot process a
          # cross-built foreign-arch ELF, so cargo-deb's own strip pass must
          # be skipped or the arm64 build fails. (Same fix as velnor.)
          mise exec "cargo:cargo-deb@3.7.0" -- cargo deb --target ${{ matrix.target }} --no-build --no-strip --deb-version "$VERSION"
          ls -la target/${{ matrix.target }}/debian/*.deb

      - name: Stage .deb for artifacts
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DEB_SRC=$(find "target/${{ matrix.target }}/debian" -maxdepth 1 -name 'holla_*.deb' | head -1)
          DEB_DST="holla-${VERSION}-${{ matrix.target }}.deb"
          cp "$DEB_SRC" "$DEB_DST"
          sha256sum "$DEB_DST" | awk '{print $1}' > "$DEB_DST.sha256"
          ls -l "$DEB_DST"*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.config.writer
        with:
          name: holla-deb-${{ matrix.target }}
          path: |
            holla-*.deb
            holla-*.deb.sha256

  release:
    name: Attach and deliver (${{ matrix.config.lane }})
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach .deb(s) to the GitHub Release (source)
        if: matrix.config.writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Create the release if it does not exist yet (the main release.yml may have created it with tarballs), then upload the deb assets.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" artifacts/holla-*-unknown-linux-gnu.deb artifacts/holla-*-unknown-linux-gnu.deb.sha256 --clobber

      - name: Push .deb(s) to holla-apt + trigger publish (optional)
        if: matrix.config.writer
        # Same pattern as velnor: the source may be private (or we want consistent
        # delivery). holla-apt publishes from its *own* release. So we upload the
        # .deb(s) to a holla-apt release (same tag), then trigger its publish workflow.
        # Needs GH_HOLLA_APT_TOKEN: a PAT with Contents:write + Actions:write on
        # tailrocks/holla-apt. Without it, publish manually (see echo below).
        env:
          APT_TOKEN: ${{ secrets.GH_HOLLA_APT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${APT_TOKEN:-}" ]; then
            echo "No GH_HOLLA_APT_TOKEN secret; skipping auto-publish to apt."
            echo "Publish manually:"
            echo "  gh release upload $TAG holla-*-unknown-linux-gnu.deb holla-*-unknown-linux-gnu.deb.sha256 --repo tailrocks/holla-apt --clobber"
            echo "  gh workflow run publish.yml --repo tailrocks/holla-apt -f version=$TAG"
            exit 0
          fi
          export GH_TOKEN="$APT_TOKEN"
          gh release view "$TAG" --repo tailrocks/holla-apt >/dev/null 2>&1 \
            || gh release create "$TAG" --repo tailrocks/holla-apt --title "holla $TAG (debs)" --notes "holla .debs for apt repository (amd64 + arm64)."
          gh release upload "$TAG" artifacts/holla-*-unknown-linux-gnu.deb artifacts/holla-*-unknown-linux-gnu.deb.sha256 --repo tailrocks/holla-apt --clobber
          gh workflow run publish.yml --repo tailrocks/holla-apt -f version="$TAG"
          echo "Uploaded holla debs to holla-apt $TAG and triggered publish."
