name: Renovate

on:
  merge_group:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Renovate (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || ((github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') || github.event_name == 'push') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Renovate data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate/cache
          key: renovate-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            renovate-${{ runner.os }}-

      - name: Prepare shared Renovate data
        # The action deliberately runs its container as an unprivileged user
        # and mounts nothing but /tmp. RENOVATE_BASE_DIR therefore lives under
        # /tmp on both lanes: /github/workspace is uncreatable inside the
        # container on stock GitHub-hosted runners (EACCES mkdir '/github'),
        # and a custom docker-volumes workspace mount is rejected by Velnor
        # strict slots (capability_validation). The restored cache belongs to
        # the host runner, so keep the shared boundary world-writable without
        # coupling the workflow to either side's numeric UID.
        run: |
          install -d -m 0777 /tmp/renovate /tmp/renovate/cache /tmp/renovate/repos
          chmod -R a+rwX /tmp/renovate

      - name: Self-hosted Renovate
        if: matrix.config.writer
        # The PAT named "tailrocks-renovate" (fine-grained, not classic) must be
        # stored in the repo secret GH_RENOVATE_TOKEN.
        uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
        with:
          token: ${{ secrets.GH_RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: false
          RENOVATE_REPOSITORY_CACHE: enabled
          RENOVATE_BASE_DIR: /tmp/renovate
          # Pin the git author identity so the DCO sign-off trailer in
          # renovate.json::commitBody always matches the commit-author
          # email. DCO-2 requires the Signed-off-by email to equal the
          # commit-author email; without this pin, a change in Renovate's
          # default author would silently break DCO on every Renovate PR.
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@whitesourcesoftware.com>"
          LOG_LEVEL: debug
