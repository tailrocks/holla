name: Renovate

on:
  merge_group:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache Renovate data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate/cache
          key: renovate-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            renovate-${{ runner.os }}-

      - name: Prepare shared Renovate data
        # The action deliberately runs its container as an unprivileged user.
        # The restored cache belongs to the host runner, while /tmp is bind
        # mounted into the container. Make that shared boundary writable
        # without coupling the workflow to either side's numeric UID.
        run: |
          sudo install -d -m 0777 /tmp/renovate /tmp/renovate/cache /tmp/renovate/repos
          sudo chmod -R a+rwX /tmp/renovate

      - name: Self-hosted Renovate
        # The PAT named "tailrocks-renovate" (fine-grained, not classic) must be
        # stored in the repo secret GH_RENOVATE_TOKEN.
        uses: renovatebot/github-action@22e0a16091fc706b04affe6ae53d5e3358ac4023 # v46.1.19
        with:
          token: ${{ secrets.GH_RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: false
          RENOVATE_REPOSITORY_CACHE: enabled
          # Pin the git author identity so the DCO sign-off trailer in
          # renovate.json::commitBody always matches the commit-author
          # email. DCO-2 requires the Signed-off-by email to equal the
          # commit-author email; without this pin, a change in Renovate's
          # default author would silently break DCO on every Renovate PR.
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@whitesourcesoftware.com>"
          LOG_LEVEL: debug
