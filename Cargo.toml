[package]
name = "holla-cli"
version = "0.2.0"
edition = "2024"
description = "Adaptive dev environment CLI — adapts to what you have installed"
license = "MIT"
repository = "https://github.com/tailrocks/holla"
homepage = "https://github.com/tailrocks/holla"
keywords = ["cli", "dev", "docker", "git", "brew"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "holla"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "color", "help", "usage"] }
tokio = { version = "1.45", features = ["full"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
owo-colors = "4.1"
tabled = { version = "0.17", features = ["std"] }
indicatif = { version = "0.17", features = ["tokio"] }
anyhow = "1.0"
thiserror = "2.0"
which = "7.0"
tokio-stream = "0.1"
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
