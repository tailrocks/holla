[package]
name = "holla-cli"
version = "0.1.0-dev"
build = "build.rs"
edition = "2024"
description = "Adaptive dev environment CLI — adapts to what you have installed"
license = "Apache-2.0"
repository = "https://github.com/tailrocks/holla"
homepage = "https://github.com/tailrocks/holla"
keywords = ["cli", "dev", "docker", "git", "brew"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "holla"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "color", "help", "usage"] }
tokio = { version = "1.45", features = ["full"] }
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
termrock = { git = "https://github.com/tailrocks/termrock.git", rev = "534e3c2db8de18da84f0d5a1211c136d0cb2d898", features = ["crossterm"] }
anyhow = "1.0"
thiserror = "2.0"
which = "8.0"
tokio-stream = "0.1"
futures = "0.3"
libc = "0.2"
nucleo-matcher = "0.3"
unicode-segmentation = "1.12"
jwalk = "0.8"
rayon = "1"
dashmap = "6"
dirs = "6"
humansize = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5.2.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Debian packaging via cargo-deb.
# The dedicated .github/workflows/release-deb.yml (triggered on tags, modeled on
# velnor-project/velnor's release-deb.yml) handles:
#   cargo deb --target <target> --no-build --deb-version "$VERSION"
# It produces the .deb(s), attaches to the source release, uploads to the
# holla-apt repo's release (cross-repo), and triggers holla-apt/publish.yml.
# See also the assets handling and glibc 2.17 zigbuild in that workflow.
[package.metadata.deb]
name = "holla"
maintainer = "Tailrocks <info@tailrocks.com>"
copyright = "2026, Tailrocks"
license-file = []
extended-description = """\
Adaptive dev environment CLI. Run `holla` in any directory and get an
interactive menu showing exactly what you can do — based on what tools
are installed on your machine. No config. No setup."""
section = "devel"
priority = "optional"
depends = "$auto"
maintainer-scripts = "debian/"
# The [[bin]] "holla" is automatically packaged to /usr/bin/holla.
# Add extra assets here later if we ship shell completions, man pages, etc.
