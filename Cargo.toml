[package]
name = "holla-cli"
version = "0.1.0-dev"
build = "build.rs"
edition = "2024"
rust-version = "1.97.1"
description = "Adaptive dev environment CLI — adapts to what you have installed"
license = "Apache-2.0"
repository = "https://github.com/tailrocks/holla"
homepage = "https://github.com/tailrocks/holla"
keywords = ["cli", "dev", "docker", "git", "brew"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "holla"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive", "color", "help", "usage"] }
tokio = { version = "=1.53.1", features = ["full"] }
ratatui = "=0.30.2"
crossterm = { version = "=0.29.0", features = ["event-stream"] }
termrock = { git = "https://github.com/tailrocks/termrock.git", rev = "855a0494ec5a03e870148cb426bd2acaa19d9a2b", features = ["crossterm"] }
anyhow = "=1.0.104"
thiserror = "=2.0.19"
which = "=8.0.5"
tokio-stream = "=0.1.19"
futures = "=0.3.33"
libc = "=0.2.189"
nucleo-matcher = "=0.3.1"
unicode-segmentation = "=1.13.3"
jwalk = "=0.9.0"
fff-search = { git = "https://github.com/dmtrKovalenko/fff.git", rev = "b6f351d7295d3f89d4f9ecaa94d72089964edc0f" }
rayon = "=1.12.0"
dashmap = "=6.2.1"
dirs = "=6.0.0"
humansize = "=2.1.3"
humantime = "=2.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
trash = "=5.2.6"
toml = "=1.1.4"
sha2 = "=0.11.0"

[dev-dependencies]
tempfile = "=3.27.0"
assert_cmd = "=2.2.2"
predicates = "=3.1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Debian packaging via cargo-deb.
# The dedicated .github/workflows/release-deb.yml (triggered on tags, modeled on
# velnor-project/velnor's release-deb.yml) handles:
#   cargo deb --target <target> --no-build --deb-version "$VERSION"
# It produces the .deb(s), attaches to the source release, uploads to the
# holla-apt repo's release (cross-repo), and triggers holla-apt/publish.yml.
# See also the assets handling and glibc 2.17 zigbuild in that workflow.
[package.metadata.deb]
name = "holla"
maintainer = "Tailrocks <info@tailrocks.com>"
copyright = "2026, Tailrocks"
license-file = []
extended-description = """\
Adaptive dev environment CLI. Run `holla` in any directory and get an
interactive menu showing exactly what you can do — based on what tools
are installed on your machine. No config. No setup."""
section = "devel"
priority = "optional"
depends = "$auto"
maintainer-scripts = "debian/"
# The [[bin]] "holla" is automatically packaged to /usr/bin/holla.
# Add extra assets here later if we ship shell completions, man pages, etc.
